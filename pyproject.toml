[project]
name = "distribution"
version = "0.1.0"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy",
    "ruff",
    "pylint",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint]
main.py-version = "3.10"
main.jobs = 0                       # 0 means all available cores
main.fail-on = ["useless-suppression"]
design.max-module-lines = 1300      # single-file design is intentional
reports.output-format = "colorized"
basic.bad-names = ["foo", "baz", "toto", "tutu", "tata"]

[tool.pylint."messages_control"]
disable = [
    "W0511",  # fixme — intentional FIXME comments the author wants to keep
    "W1203",  # logging-fstring-interpolation — we use f-strings consistently
    "R0902",  # too-many-instance-attributes — Settings is a config class
    "R0903",  # too-few-public-methods — Settings is a data/config class, not an OOP service
]
enable = ["useless-suppression"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with ruff format
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "E501",    # line length — handled by ruff format
    "G",       # flake8-logging-format — we use f-strings in logging calls
    "T20",     # print statements — this is a CLI tool
    "TD",      # TODO/FIXME format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["INP001", "S"]
